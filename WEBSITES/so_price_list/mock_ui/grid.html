<title>Eschler Price Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --surface-2:#FAFBFA; --surface-3:#F0F3F1;
  --ink:#14181A; --ink-2:#49534F; --muted:#7B8582;
  --rule:#DDE3E0; --rule-strong:#BFC9C5;
  --accent:#0E6A72; --accent-soft:#E2EFEF;
  --usd-tint:#EDF5F4; --usd-ink:#0E6A72;
  --thb-tint:#FAF2EA; --thb-ink:#95511F;
  --warn:#A85F08; --warn-soft:#FBEBD2; --warn-rule:#E3B268;
  --sel:#0E6A72; --sel-soft:#D9ECEC;
  --shadow:0 1px 2px rgba(20,24,26,.06), 0 6px 20px rgba(20,24,26,.07);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --paper:#0F1413; --surface:#161B1A; --surface-2:#1B2120; --surface-3:#212927;
  --ink:#E7EDEB; --ink-2:#AFB9B6; --muted:#7C8683;
  --rule:#28302E; --rule-strong:#3A4442;
  --accent:#54C2C6; --accent-soft:#15302F;
  --usd-tint:#14211F; --usd-ink:#5FC8C0;
  --thb-tint:#241A13; --thb-ink:#D99A63;
  --warn:#E3A54A; --warn-soft:#2C2314; --warn-rule:#5C4620;
  --sel:#54C2C6; --sel-soft:#1B3634;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#0F1413; --surface:#161B1A; --surface-2:#1B2120; --surface-3:#212927;
  --ink:#E7EDEB; --ink-2:#AFB9B6; --muted:#7C8683;
  --rule:#28302E; --rule-strong:#3A4442;
  --accent:#54C2C6; --accent-soft:#15302F;
  --usd-tint:#14211F; --usd-ink:#5FC8C0;
  --thb-tint:#241A13; --thb-ink:#D99A63;
  --warn:#E3A54A; --warn-soft:#2C2314; --warn-rule:#5C4620;
  --sel:#54C2C6; --sel-soft:#1B3634;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 22px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.45;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px; background:var(--surface);
  border-bottom:1px solid var(--rule);
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:2px}
.brand h1{
  margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em;
}
.brand .tag{
  font-size:10px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-soft);
  padding:2px 6px; border-radius:3px;
}
.pick{display:flex; align-items:center; gap:7px}
.pick label{
  font-size:10px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted);
}
select,input[type=search]{
  font-family:inherit; font-size:13px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--rule-strong);
  border-radius:5px; padding:5px 8px;
}
select{min-width:250px; font-weight:500}
input[type=search]{width:150px}
select:focus-visible,input:focus-visible,button:focus-visible{
  outline:2px solid var(--sel); outline-offset:1px;
}
.spacer{flex:1}
button{
  font-family:inherit; font-size:12px; font-weight:500; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--rule-strong);
  border-radius:5px; padding:5px 10px; cursor:pointer;
}
button:hover{background:var(--surface-3); border-color:var(--muted)}
button.on{background:var(--warn-soft); border-color:var(--warn-rule); color:var(--warn)}
button.ghost{background:transparent; border-color:transparent; color:var(--muted); padding:5px 7px}
button.ghost:hover{background:var(--surface-3); color:var(--ink)}

/* ---------- header meta strip ---------- */
.meta{
  display:flex; gap:0; flex-wrap:wrap; align-items:stretch;
  background:var(--surface-2); border-bottom:1px solid var(--rule);
  padding:0 16px;
}
.mf{
  display:flex; flex-direction:column; gap:1px;
  padding:8px 18px 9px 0; margin-right:18px;
  border-right:1px solid var(--rule); justify-content:center;
}
.mf:last-child{border-right:none}
.mf .k{
  font-size:9.5px; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted);
}
.mf .v{font-size:12.5px; font-weight:500; color:var(--ink)}
.mf .v.dim{color:var(--muted); font-weight:400; font-style:italic}
.pillrow{display:flex; gap:5px; align-items:center}
.pill{
  font-size:10px; font-weight:600; letter-spacing:.04em;
  padding:2px 7px; border-radius:99px; border:1px solid transparent;
}
.pill.open{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.pill.warnp{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-rule)}

/* ---------- grid ---------- */
.gridwrap{flex:1; overflow:auto; background:var(--surface)}
table{border-collapse:separate; border-spacing:0; font-size:12px}
thead th{
  position:sticky; background:var(--surface-3); color:var(--ink-2);
  font-weight:600; text-align:left; white-space:nowrap;
  border-right:1px solid var(--rule); border-bottom:1px solid var(--rule-strong);
  padding:0 8px; height:25px; z-index:3;
}
thead tr:first-child th{top:0}
thead tr:nth-child(2) th{top:25px}
thead th.grp{
  text-align:center; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  border-bottom:1px solid var(--rule);
}
thead th.grp.usd{background:var(--usd-tint); color:var(--usd-ink)}
thead th.grp.thb{background:var(--thb-tint); color:var(--thb-ink)}
thead th.usdc{background:var(--usd-tint); color:var(--usd-ink)}
thead th.thbc{background:var(--thb-tint); color:var(--thb-ink)}
thead th.num{text-align:right}
th.stk,td.stk{position:sticky; z-index:2}
thead th.stk{z-index:5}
th.s0,td.s0{left:0; width:38px; min-width:38px}
th.s1,td.s1{left:38px; width:104px; min-width:104px}
td.stk{background:var(--surface-2); border-right:1px solid var(--rule-strong)}
thead th.s0,thead th.s1{border-right:1px solid var(--rule-strong)}

tbody td{
  border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);
  padding:0 8px; height:25px; white-space:nowrap; color:var(--ink);
}
tbody td.num{text-align:right; font-variant-numeric:tabular-nums}
tbody td.usdc{background:var(--usd-tint)}
tbody td.thbc{background:var(--thb-tint)}
tbody td.usdc .val{color:var(--usd-ink); font-weight:500}
tbody td.thbc .val{color:var(--thb-ink); font-weight:500}
tbody tr.newart td{border-top:2px solid var(--rule-strong)}
tbody td.rn{color:var(--muted); text-align:right; font-size:10.5px}
tbody td.dim{color:var(--muted)}
.nil{color:var(--rule-strong)}
tbody td.cell{cursor:cell; position:relative}
tbody td.cell:hover{box-shadow:inset 0 0 0 1px var(--rule-strong)}
tbody td.foc{box-shadow:inset 0 0 0 2px var(--sel); background:var(--sel-soft)}
tbody td.conf{background:var(--warn-soft)}
tbody td.conf .val{color:var(--warn)}
.badge{
  display:inline-block; margin-left:5px; font-size:9px; font-weight:700;
  background:var(--warn); color:var(--surface);
  border-radius:99px; padding:0 5px; line-height:14px; vertical-align:1px;
}
:root[data-theme="dark"] .badge,
:root:not([data-theme="light"]) .badge{color:#12100A}
td input.edit{
  width:100%; border:none; outline:none; background:transparent;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink);
  text-align:right; padding:0;
}

/* ---------- conflict popover ---------- */
.pop{
  position:absolute; z-index:40; min-width:230px;
  background:var(--surface); border:1px solid var(--rule-strong);
  border-radius:7px; box-shadow:var(--shadow); padding:9px 10px 10px;
}
.pop h4{
  margin:0 0 2px; font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; color:var(--warn);
}
.pop .sub{margin:0 0 8px; font-size:11px; color:var(--muted)}
.opt{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:6px 7px; border-radius:5px; cursor:pointer;
  border:1px solid var(--rule); background:var(--surface-2);
  margin-bottom:5px; text-align:left;
}
.opt:hover{border-color:var(--accent); background:var(--accent-soft)}
.opt.chosen{border-color:var(--accent); background:var(--accent-soft)}
.opt .p{
  font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:600;
  color:var(--ink); font-variant-numeric:tabular-nums; min-width:62px;
}
.opt .m{font-size:10.5px; color:var(--muted); line-height:1.3}
.opt .tick{margin-left:auto; color:var(--accent); font-weight:700; visibility:hidden}
.opt.chosen .tick{visibility:visible}

/* ---------- status bar ---------- */
.status{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:6px 16px; background:var(--surface); border-top:1px solid var(--rule);
  font-size:11px; color:var(--muted);
}
.status b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
kbd{
  font-family:"IBM Plex Mono",monospace; font-size:10px;
  background:var(--surface-3); border:1px solid var(--rule-strong);
  border-bottom-width:2px; border-radius:3px; padding:0 4px; color:var(--ink-2);
}
.flash{
  position:fixed; bottom:44px; left:50%; transform:translateX(-50%) translateY(6px);
  background:var(--ink); color:var(--paper); font-size:11.5px; font-weight:500;
  padding:6px 13px; border-radius:99px; opacity:0; pointer-events:none;
  transition:opacity .16s, transform .16s; z-index:60;
}
.flash.on{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){ .flash{transition:none} }
</style>

<script>
const DATA  = JSON.parse(document.getElementById("data").textContent);
const LISTS = DATA.lists;
const KEY   = "eschler_pricebook_v2";

// Local overrides only - the seed data is never mutated, so Reset is exact.
// { "<detailId>": price }        edited prices
// { "<cellKey>": detailId }      which candidate wins a conflicted cell
let edits  = {};
let picks  = {};
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}");
      edits = s.edits || {}; picks = s.picks || {}; } catch(e){}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify({edits, picks})); } catch(e){}
}

const $  = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v,ccy) => v==null ? "" :
  ccy==="THB" ? Number(v).toFixed(2).replace(/\.00$/,"")
              : Number(v).toFixed(4).replace(/0+$/,"").replace(/\.$/,"");

let cur = LISTS[0], view = [], focus = null, onlyConflicts = false, filter = "";

const cellKey = (r,ccy,tier) => `${cur.id}|${r.art}|${r.var}|${r.qmin}|${r.qmax}|${r.qu}|${ccy}|${tier}`;
const cands   = (r,ccy,tier) => r.cells[`${ccy}|${tier}`] || [];
function priceOf(c){ return (c.id in edits) ? edits[c.id] : c.price; }
function winner(r,ccy,tier){
  const cs = cands(r,ccy,tier);
  if(!cs.length) return null;
  if(cs.length===1) return cs[0];                      // resolves automatically
  const pinned = picks[cellKey(r,ccy,tier)];           // user picked one
  return cs.find(c=>c.id===pinned) || cs[0];
}
const rowConflicts = r => Object.values(r.cells).filter(cs=>cs.length>1).length;

/* ---------- list picker ---------- */
function fillPicker(){
  $("listsel").innerHTML = LISTS.map(l=>{
    const n = l.rows.reduce((a,r)=>a+rowConflicts(r),0);
    return `<option value="${l.id}">${esc(l.list_name)} ยท ${l.rows.length} rows${n?` ยท ${n} conflicts`:""}</option>`;
  }).join("");
  $("listsel").value = cur.id;
}

/* ---------- header meta ---------- */
function renderMeta(){
  const lines = cur.rows.reduce((a,r)=>a+Object.values(r.cells).reduce((b,cs)=>b+cs.length,0),0);
  const conf  = cur.rows.reduce((a,r)=>a+rowConflicts(r),0);
  const f = (k,v,dim) => `<div class="mf"><span class="k">${k}</span><span class="v${dim?" dim":""}">${v}</span></div>`;
  $("meta").innerHTML =
    f("Header id", `<span class="mono">${cur.id}</span>`) +
    f("Customer", cur.customer_id
        ? `${esc(cur.customer_name||"")} <span class="mono">#${esc(cur.customer_id)}</span>`
        : "not mapped โ€” list chosen by name", !cur.customer_id) +
    f("Workbook name", esc(cur.customer_excel)) +
    f("Terms", cur.terms ? esc(cur.terms) : "not stated", !cur.terms) +
    f("Valid", cur.valid_from || cur.valid_to
        ? `${esc(cur.valid_from||"โ€”")} โ’ ${esc(cur.valid_to||"open")}`
        : "no dates โ€” always current", !(cur.valid_from||cur.valid_to)) +
    f("Quote ref", cur.quote_ref ? esc(cur.quote_ref) : "โ€”", !cur.quote_ref) +
    `<div class="mf"><span class="k">Detail lines</span><span class="pillrow">
       <span class="pill open">${lines} in DB</span>
       ${conf?`<span class="pill warnp">${conf} conflicts</span>`:""}
     </span></div>`;
}

/* ---------- grid ---------- */
const INFO = [["fab","Fabric"],["comp","Composition"],["fw","Full W"],["uw","Usable W"],["wt","g/mยฒ"],["moq","MOQ"]];

function renderHead(){
  const T = cur.tiers;
  const r1 = [`<th class="stk s0" rowspan="2"></th>`,
              `<th class="stk s1" rowspan="2">Article</th>`,
              `<th rowspan="2">Var</th>`,
              `<th class="grp" colspan="3">Quantity</th>`,
              `<th class="grp usd" colspan="${T.length}">USD ยท $ per unit</th>`,
              `<th class="grp thb" colspan="${T.length}">THB ยท เธฟ per unit</th>`,
              `<th class="grp" colspan="${INFO.length}">Article detail</th>`,
              `<th rowspan="2" class="num">Sheet row</th>`];
  const r2 = [`<th class="num">Min</th>`,`<th class="num">Max</th>`,`<th>Unit</th>`,
              ...T.map(t=>`<th class="num usdc">${esc(t)}</th>`),
              ...T.map(t=>`<th class="num thbc">${esc(t)}</th>`),
              ...INFO.map(([,l])=>`<th>${esc(l)}</th>`)];
  $("grid").tHead.innerHTML = `<tr>${r1.join("")}</tr><tr>${r2.join("")}</tr>`;
}

function buildView(){
  const q = filter.trim().toLowerCase();
  view = cur.rows.filter(r=>{
    if(onlyConflicts && !rowConflicts(r)) return false;
    if(!q) return true;
    return (r.art+" "+r.var+" "+r.fab+" "+r.comp).toLowerCase().includes(q);
  });
}

function priceCell(r,ri,ccy,tier,ci){
  const cs = cands(r,ccy,tier), w = winner(r,ccy,tier);
  const cls = ["cell","num",ccy==="USD"?"usdc":"thbc"];
  if(cs.length>1) cls.push("conf");
  if(focus && focus.r===ri && focus.c===ci) cls.push("foc");
  const body = w
    ? `<span class="val mono">${money(priceOf(w),ccy)}</span>${cs.length>1?`<span class="badge">${cs.length}</span>`:""}`
    : `<span class="nil">ยท</span>`;
  return `<td class="${cls.join(" ")}" data-r="${ri}" data-c="${ci}" data-ccy="${ccy}" data-tier="${esc(tier)}">${body}</td>`;
}

function renderBody(){
  const T = cur.tiers;
  let html = "", prevArt = null;
  view.forEach((r,ri)=>{
    const newArt = r.art !== prevArt; prevArt = r.art;
    let ci = 0;
    const tds = [
      `<td class="stk s0 rn">${ri+1}</td>`,
      `<td class="stk s1 mono">${esc(r.art)}</td>`,
      `<td class="dim">${esc(r.var)||"<span class='nil'>ยท</span>"}</td>`,
      `<td class="num mono">${r.qmin}</td>`,
      `<td class="num mono">${r.qmax===""?"<span class='nil'>โ</span>":r.qmax}</td>`,
      `<td class="dim">${esc(r.qu)}</td>`,
      ...T.map(t=>priceCell(r,ri,"USD",t,ci++)),
      ...T.map(t=>priceCell(r,ri,"THB",t,ci++)),
      ...INFO.map(([k])=>`<td class="dim">${esc(r[k])||"<span class='nil'>ยท</span>"}</td>`),
      `<td class="num mono dim">${r.src||""}</td>`
    ];
    html += `<tr class="${newArt?"newart":""}">${tds.join("")}</tr>`;
  });
  $("grid").tBodies[0].innerHTML = html ||
    `<tr><td colspan="99" style="padding:22px;color:var(--muted)">No rows match.</td></tr>`;
}

function renderStatus(){
  const shown = view.length, all = cur.rows.length;
  const conf  = view.reduce((a,r)=>a+rowConflicts(r),0);
  const nEdit = Object.keys(edits).length, nPick = Object.keys(picks).length;
  $("status").innerHTML =
    `<span><b>${shown}</b>${shown!==all?` of <b>${all}</b>`:""} grid rows</span>` +
    `<span><b>${DATA.n_details.toLocaleString()}</b> detail rows across <b>${DATA.n_headers}</b> lists</span>` +
    (conf?`<span style="color:var(--warn)"><b style="color:var(--warn)">${conf}</b> cells need a pick</span>`:"") +
    (nEdit?`<span><b>${nEdit}</b> edited</span>`:"") +
    (nPick?`<span><b>${nPick}</b> resolved</span>`:"") +
    `<span class="spacer"></span>` +
    `<span><kbd>โ‘โ“โโ’</kbd> move ยท <kbd>Enter</kbd> edit ยท <kbd>Space</kbd> pick price ยท <kbd>Esc</kbd> cancel</span>`;
}

function render(){ buildView(); renderHead(); renderBody(); renderStatus(); }
function flash(m){ const f=$("flash"); f.textContent=m; f.classList.add("on");
  clearTimeout(f._t); f._t=setTimeout(()=>f.classList.remove("on"),1100); }

/* ---------- focus + keyboard ---------- */
function tdAt(r,c){ return $("grid").querySelector(`td.cell[data-r="${r}"][data-c="${c}"]`); }
function maxC(){ return cur.tiers.length*2 - 1; }
function setFocus(r,c,scroll){
  if(r<0||c<0||r>=view.length||c>maxC()) return;
  const prev = focus && tdAt(focus.r,focus.c);
  if(prev) prev.classList.remove("foc");
  focus = {r,c};
  const td = tdAt(r,c);
  if(td){ td.classList.add("foc"); if(scroll!==false) td.scrollIntoView({block:"nearest",inline:"nearest"}); }
}

function beginEdit(){
  if(!focus) return;
  const td = tdAt(focus.r,focus.c); if(!td) return;
  const r = view[focus.r], ccy = td.dataset.ccy, tier = td.dataset.tier;
  const w = winner(r,ccy,tier);
  if(!w){ flash("No price line here โ€” add one in the detail table"); return; }
  const before = td.innerHTML;
  td.innerHTML = `<input class="edit mono" value="${priceOf(w)}">`;
  const inp = td.querySelector("input"); inp.focus(); inp.select();
  const done = commit => {
    if(commit){
      const n = parseFloat(inp.value);
      if(!isNaN(n) && n>=0){
        if(n===w.price) delete edits[w.id]; else edits[w.id]=n;
        persist(); flash(`${r.art} ยท ${tier} ยท ${ccy} โ’ ${money(n,ccy)}`);
      }
    }
    td.innerHTML = before; renderBody(); renderStatus(); setFocus(focus.r,focus.c,false);
  };
  inp.addEventListener("blur",()=>done(true));
  inp.addEventListener("keydown",e=>{
    e.stopPropagation();
    if(e.key==="Enter"){ e.preventDefault(); inp.blur(); setFocus(focus.r+1,focus.c); }
    else if(e.key==="Escape"){ e.preventDefault(); inp.value=String(priceOf(w)); inp.blur(); }
    else if(e.key==="Tab"){ e.preventDefault(); inp.blur(); setFocus(focus.r,focus.c+(e.shiftKey?-1:1)); }
  });
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")) return;
  if(!focus && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){ setFocus(0,0); e.preventDefault(); return; }
  if(!focus) return;
  const {r,c} = focus;
  switch(e.key){
    case "ArrowUp":    setFocus(r-1,c); e.preventDefault(); break;
    case "ArrowDown":  setFocus(r+1,c); e.preventDefault(); break;
    case "ArrowLeft":  setFocus(r,c-1); e.preventDefault(); break;
    case "ArrowRight": setFocus(r,c+1); e.preventDefault(); break;
    case "Enter": case "F2": beginEdit(); e.preventDefault(); break;
    case " ": openPop(tdAt(r,c)); e.preventDefault(); break;
    case "Escape": closePop(); break;
  }
});

/* ---------- conflict picker ---------- */
let pop = null;
function closePop(){ if(pop){ pop.remove(); pop = null; } }
function openPop(td){
  closePop(); if(!td) return;
  const r = view[+td.dataset.r], ccy = td.dataset.ccy, tier = td.dataset.tier;
  const cs = cands(r,ccy,tier);
  if(cs.length<2){ if(cs.length===1) flash("Single price line โ€” resolves automatically"); return; }
  const k = cellKey(r,ccy,tier), w = winner(r,ccy,tier);
  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML =
    `<h4>${cs.length} price lines match</h4>
     <p class="sub">${esc(r.art)} ยท ${esc(tier)} ยท ${ccy} ยท ${r.qmin}โ€“${r.qmax===""?"โ":r.qmax} ${esc(r.qu)}</p>` +
    cs.map(c=>`<button class="opt${c.id===w.id?" chosen":""}" data-id="${c.id}">
        <span class="p">${money(priceOf(c),ccy)}</span>
        <span class="m">detail #${c.id}<br>sheet row ${c.src}</span>
        <span class="tick">โ“</span></button>`).join("");
  document.body.appendChild(el);
  const b = td.getBoundingClientRect();
  el.style.left = Math.min(b.left, innerWidth - el.offsetWidth - 12) + "px";
  el.style.top  = Math.min(b.bottom + 4, innerHeight - el.offsetHeight - 12) + "px";
  el.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>{
    picks[k] = +btn.dataset.id; persist(); closePop();
    renderBody(); renderStatus(); setFocus(focus.r,focus.c,false);
    flash(`Picked ${money(priceOf(cs.find(c=>c.id===+btn.dataset.id)),ccy)} for ${r.art}`);
  }));
  pop = el;
}
document.addEventListener("mousedown",e=>{ if(pop && !pop.contains(e.target)) closePop(); });

$("grid").addEventListener("click",e=>{
  const td = e.target.closest("td.cell"); if(!td) return;
  setFocus(+td.dataset.r, +td.dataset.c, false);
  if(e.target.closest(".badge")) openPop(td);
});
$("grid").addEventListener("dblclick",e=>{
  const td = e.target.closest("td.cell"); if(!td) return;
  setFocus(+td.dataset.r, +td.dataset.c, false);
  cands(view[+td.dataset.r], td.dataset.ccy, td.dataset.tier).length>1 ? openPop(td) : beginEdit();
});

/* ---------- controls ---------- */
$("listsel").addEventListener("change",e=>{
  cur = LISTS.find(l=>l.id===+e.target.value);
  focus = null; closePop(); renderMeta(); render(); $("wrap").scrollTop = 0;
});
$("q").addEventListener("input",e=>{ filter = e.target.value; focus = null; render(); });
$("conflictbtn").addEventListener("click",e=>{
  onlyConflicts = !onlyConflicts;
  e.target.classList.toggle("on", onlyConflicts);
  focus = null; render();
});
$("resetbtn").addEventListener("click",()=>{
  if(!Object.keys(edits).length && !Object.keys(picks).length){ flash("Nothing to reset"); return; }
  edits = {}; picks = {}; persist(); renderBody(); renderStatus(); flash("Local edits discarded");
});
$("csvbtn").addEventListener("click",()=>{
  // Export TALL - one row per currency, matching so_price_list_detail exactly.
  const head = ["header_id","list_name","article","article_variant","qty_min","qty_max",
                "qty_unit","color_tier","currency","price","detail_id","source_row","picked"];
  const out = [head.join(",")];
  view.forEach(r=>{
    ["USD","THB"].forEach(ccy=>cur.tiers.forEach(t=>{
      const cs = cands(r,ccy,t); if(!cs.length) return;
      const w = winner(r,ccy,t);
      cs.forEach(c=>out.push([cur.id,`"${cur.list_name}"`,r.art,r.var,r.qmin,r.qmax,r.qu,
        `"${t}"`,ccy,priceOf(c),c.id,c.src,c.id===w.id?"Y":"N"].join(",")));
    }));
  });
  const url = URL.createObjectURL(new Blob([out.join("\n")],{type:"text/csv"}));
  const a = document.createElement("a");
  a.href = url; a.download = `price_list_${cur.list_name.replace(/\W+/g,"_")}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  flash(`Exported ${out.length-1} detail rows`);
});

/* ---------- go ---------- */
fillPicker(); renderMeta(); render();
</script>
